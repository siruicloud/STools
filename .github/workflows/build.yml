name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '预发布版本号，例如 3.0.0-beta.1'
        required: true
      prerelease:
        description: '是否发布为 GitHub Pre-release'
        type: boolean
        default: true
      publish_release:
        description: '是否发布到 GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            prerelease="${INPUT_PRERELEASE:-true}"
          else
            version="${GITHUB_REF_NAME#v}"
            prerelease="false"
          fi

          if [ -z "$version" ]; then
            echo "Release version is required" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make_latest=$([ "$prerelease" = "true" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version=process.env.RELEASE_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install plugin dependencies
        run: |
          cd internal-plugins/setting
          pnpm install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package Windows
        run: pnpm run build:win

      # 上传 Windows 产物（安装包/zip/更新元数据）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn

  release:
    name: Release
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            prerelease="${INPUT_PRERELEASE:-true}"
          else
            version="${GITHUB_REF_NAME#v}"
            prerelease="false"
          fi

          if [ -z "$version" ]; then
            echo "Release version is required" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make_latest=$([ "$prerelease" = "true" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version=process.env.RELEASE_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-windows-x64
          path: dist/windows

      - name: Generate update info
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          WINDOWS_UPDATE_METADATA: dist/windows/latest.yml
          UPDATE_METADATA_OUTPUT_DIR: dist/release
          REQUIRE_UPDATE_METADATA: 'true'
        run: pnpm updater

      # 上传安装包、更新包、blockmap 和最终元数据。
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_meta.outputs.tag }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          make_latest: ${{ steps.release_meta.outputs.make_latest }}
          body_path: changelog.md
          files: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*.blockmap
            dist/release/*.yml
